<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reddit Order Form</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f3;
      --bg-info: #e6f1fb;
      --text-primary: #1a1a18;
      --text-secondary: #6b6b67;
      --text-tertiary: #9e9e9a;
      --text-info: #185fa5;
      --text-danger: #a32d2d;
      --text-success: #3b6d11;
      --border: rgba(0,0,0,0.15);
      --border-strong: rgba(0,0,0,0.3);
      --border-info: #378add;
      --border-danger: #e24b4a;
      --border-success: #639922;
      --bg-success: #eaf3de;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg-secondary: #252523;
        --bg-info: #0c447c;
        --text-primary: #f0ede8;
        --text-secondary: #a0a09a;
        --text-tertiary: #6b6b65;
        --text-info: #85b7eb;
        --text-danger: #f09595;
        --text-success: #97c459;
        --border: rgba(255,255,255,0.15);
        --border-strong: rgba(255,255,255,0.3);
        --border-info: #378add;
        --border-danger: #e24b4a;
        --border-success: #639922;
        --bg-success: #173404;
      }
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ── CARD ── */
    .card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }

    /* ── SCREEN SWITCHING ── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ── LOGIN ── */
    .login-header {
      margin-bottom: 1.75rem;
    }
    .login-header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .login-header p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ── ORDER HEADER ── */
    .order-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 1.75rem;
    }
    .order-header-text h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .order-header-text p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Balance chip */
    .balance-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-strong);
      border-radius: 99px;
      padding: 5px 11px 5px 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .balance-chip i {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .balance-chip .balance-label {
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .balance-chip .balance-amount {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .balance-chip .balance-amount.loading {
      color: var(--text-tertiary);
    }

    /* ── SHARED FIELDS ── */
    .field-group {
      margin-bottom: 1.25rem;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .field-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field-input:focus {
      border-color: var(--border-info);
      box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.15);
    }

    .field-input.error {
      border-color: var(--border-danger);
    }

    textarea.field-input {
      resize: vertical;
      min-height: 90px;
      line-height: 1.5;
    }

    .field-error {
      display: block;
      font-size: 12px;
      color: var(--text-danger);
      margin-top: 5px;
      min-height: 16px;
    }

    .url-hint {
      display: block;
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 4px;
    }

    .divider {
      border: none;
      border-top: 0.5px solid var(--border);
      margin: 1.5rem 0;
    }

    /* ── LOGIN BUTTON ── */
    .btn-primary {
      width: 100%;
      padding: 11px 16px;
      background: var(--text-primary);
      color: var(--bg);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── TYPE SELECTOR ── */
    .type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .type-btn {
      padding: 14px 12px;
      background: var(--bg);
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      color: var(--text-primary);
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    .type-btn .type-icon {
      font-size: 20px;
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    .type-btn .type-name {
      font-size: 14px;
      font-weight: 500;
      display: block;
      color: var(--text-primary);
    }

    .type-btn .type-desc {
      font-size: 12px;
      color: var(--text-secondary);
      display: block;
      margin-top: 2px;
    }

    .type-btn.selected {
      border: 2px solid var(--border-info);
      background: var(--bg-info);
    }

    .type-btn.selected .type-icon,
    .type-btn.selected .type-name {
      color: var(--text-info);
    }

    .type-btn.selected .type-desc {
      color: var(--text-info);
      opacity: 0.8;
    }

    /* ── PANELS ── */
    .fields-panel {
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .fields-panel.active {
      display: block !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SPEED SLIDER ── */
    .speed-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .speed-row input[type="range"] {
      flex: 1;
      accent-color: var(--border-info);
    }

    .speed-value {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-info);
      min-width: 54px;
      text-align: right;
    }

    /* ── PRICE ── */
    .price-card {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .price-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .price-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      font-family: 'DM Mono', monospace;
    }

    .success-banner {
      display: none;
      background: var(--bg-success);
      border: 0.5px solid var(--border-success);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-success);
      margin-top: 1rem;
      text-align: center;
    }
    .error-banner {
      display: none;
      background: var(--bg-info);
      border: 0.5px solid var(--border-danger);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-danger);
      margin-top: 1rem;
      text-align: center;
    }

    /* ── LOGIN ERROR BANNER ── */
    .login-error {
      display: none;
      background: #fdf0f0;
      border: 0.5px solid var(--border-danger);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-danger);
      margin-bottom: 1rem;
    }
    @media (prefers-color-scheme: dark) {
      .login-error { background: #2a1010; }
    }

    /* ── PASSWORD WRAPPER ── */
    .pw-wrap {
      position: relative;
    }
    .pw-wrap .field-input {
      padding-right: 40px;
    }
    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-tertiary);
      font-size: 16px;
      padding: 2px;
      display: flex;
      align-items: center;
    }
    .pw-toggle:hover { color: var(--text-secondary); }
  </style>
</head>
<body>

  <div class="card">

    <!-- ════════════════ LOGIN SCREEN ════════════════ -->
    <div class="screen active" id="screen-login">
      <div class="login-header">
        <h1>Sign in</h1>
        <p>Enter your credentials to access the order form.</p>
      </div>

      <div class="login-error" id="login-error">
        <i class="ti ti-alert-circle"></i> <span id="login-error-msg">Invalid username or password.</span>
      </div>

      <div class="field-group">
        <label class="field-label" for="login-username">Username</label>
        <input class="field-input" id="login-username" type="text" placeholder="Your handle" autocomplete="username">
        <span class="field-error" id="err-login-username"></span>
      </div>

      <div class="field-group">
        <label class="field-label" for="login-password">Password</label>
        <div class="pw-wrap">
          <input class="field-input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password">
          <button class="pw-toggle" type="button" onclick="togglePassword()" aria-label="Toggle password visibility">
            <i class="ti ti-eye" id="pw-icon"></i>
          </button>
        </div>
        <span class="field-error" id="err-login-password"></span>
      </div>

      <button class="btn-primary" id="login-btn" onclick="doLogin()" type="button">
        <i class="ti ti-login"></i> Sign in
      </button>
    </div>

    <!-- ════════════════ ORDER SCREEN ════════════════ -->
    <div class="screen" id="screen-order">

      <div class="order-header">
        <div class="order-header-text">
          <h1>New order</h1>
          <p>Promote your Reddit post with upvotes or comments.</p>
        </div>
        <div class="balance-chip" id="balance-chip">
          <i class="ti ti-wallet"></i>
          <span class="balance-label">Balance</span>
          <span class="balance-amount loading" id="balance-display">…</span>
        </div>
      </div>

      <!-- Client name -->
      <div class="field-group">
        <label class="field-label" for="client-name">Client name</label>
        <input class="field-input" id="client-name" type="text" placeholder="Your name or handle">
        <span class="field-error" id="err-name"></span>
      </div>

      <!-- Post URL -->
      <div class="field-group">
        <label class="field-label" for="post-url">Reddit post URL</label>
        <input class="field-input" id="post-url" type="text" placeholder="https://reddit.com/r/…/comments/…">
        <span class="url-hint">Must be a valid reddit.com/r/… post link</span>
        <span class="field-error" id="err-url"></span>
      </div>

      <hr class="divider">

      <!-- Order type selector -->
      <div class="field-group">
        <label class="field-label">Order type</label>
        <div class="type-selector">
          <button class="type-btn" id="btn-upvotes" onclick="selectType('upvotes')" type="button">
            <i class="ti ti-arrow-big-up type-icon" aria-hidden="true"></i>
            <span class="type-name">Upvotes</span>
            <span class="type-desc">Boost post score</span>
          </button>
          <button class="type-btn" id="btn-comments" onclick="selectType('comments')" type="button">
            <i class="ti ti-message-circle type-icon" aria-hidden="true"></i>
            <span class="type-name">Comments</span>
            <span class="type-desc">Add engagement</span>
          </button>
        </div>
        <span class="field-error" id="err-type"></span>
      </div>

      <!-- Upvotes panel -->
      <div class="fields-panel" id="panel-upvotes">
        <div class="field-group">
          <label class="field-label" for="upvote-amount">Number of upvotes</label>
          <input class="field-input" id="upvote-amount" type="number" min="1" placeholder="e.g. 500" oninput="updatePrice()">
          <span class="field-error" id="err-upvote-amount"></span>
        </div>

        <div class="field-group">
          <label class="field-label">Upvote speed <span style="font-weight:400;text-transform:none;letter-spacing:0">(per hour)</span></label>
          <div class="speed-row">
            <input type="range" id="upvote-speed" min="1" max="160" value="20" step="1"
              oninput="document.getElementById('speed-val').textContent = this.value + '/hr'">
            <span class="speed-value" id="speed-val">20/hr</span>
          </div>
        </div>
      </div>

      <!-- Comments panel -->
      <div class="fields-panel" id="panel-comments">
        <div class="field-group">
          <label class="field-label" for="comment-text">Comment text</label>
          <textarea class="field-input" id="comment-text" oninput="updatePrice()"
            placeholder="Write the comment to post..."></textarea>
          <span class="field-error" id="err-comment-text"></span>
        </div>
      </div>

      <hr class="divider">

      <!-- Price estimate -->
      <div class="price-card">
        <span class="price-label">Total</span>
        <span class="price-value" id="price-display">—</span>
      </div>

      <div class="success-banner" id="success-banner">
        <i class="ti ti-circle-check" aria-hidden="true"></i> Order submitted successfully!
      </div>

      <div class="error-banner" id="error-banner">
        <i class="ti ti-circle-check" aria-hidden="true"></i> Failed to submit the order
      </div>
    </div><!-- /screen-order -->

  </div><!-- /card -->

  <script>
    // ── Telegram Mini App setup ──────────────────────────────────
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // ── State ────────────────────────────────────────────────────
    let currentType = null;
    let loggedInUser = null;

    // ── Password toggle ──────────────────────────────────────────
    function togglePassword() {
      const input = document.getElementById('login-password');
      const icon  = document.getElementById('pw-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'ti ti-eye-off';
      } else {
        input.type = 'password';
        icon.className = 'ti ti-eye';
      }
    }

    // ── Login ────────────────────────────────────────────────────
    async function doLogin() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      let invalid = false;

      document.getElementById('login-error').style.display = 'none';

      if (!username) {
        document.getElementById('err-login-username').textContent = 'Please enter your username.';
        document.getElementById('login-username').classList.add('error');
        invalid = true;
      } else {
        document.getElementById('err-login-username').textContent = '';
        document.getElementById('login-username').classList.remove('error');
      }

      if (!password) {
        document.getElementById('err-login-password').textContent = 'Please enter your password.';
        document.getElementById('login-password').classList.add('error');
        invalid = true;
      } else {
        document.getElementById('err-login-password').textContent = '';
        document.getElementById('login-password').classList.remove('error');
      }

      if (invalid) return;

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="ti ti-loader-2"></i> Signing in…';

      try {
        // Replace with your actual auth endpoint if needed.
        // Here we fetch the balance using credentials; if the server
        // returns a 401/403 we treat it as a failed login.
        const res = await fetch('https://sir-compensation-inexpensive-classes.trycloudflare.com/payments/get-balance', {
          method: 'POST',
          headers: {
            'X-API-KEY': password
          },
          body: JSON.stringify({
            "client_name": username
          })
        });

        const data = await res.json();
        console.log(`${JSON.stringify(data)}`)
        if (data.status !== 'ok') {
          throw new Error('auth_failed');
        }

        loggedInUser = username;

        // Pre-fill client name
        document.getElementById('client-name').value = username;

        // Show balance
        renderBalance(data.balance ?? -1);

        // Switch screens
        document.getElementById('screen-login').classList.remove('active');
        document.getElementById('screen-order').classList.add('active');

        // Telegram main button
        if (tg) {
          tg.MainButton.setText('Send order');
          tg.MainButton.show();
          tg.MainButton.onClick(await submitOrder);
        }

      } catch (err) {
        const errEl = document.getElementById('login-error');
        const msgEl = document.getElementById('login-error-msg');
        msgEl.textContent = err.message === 'auth_failed'
          ? 'Invalid username or password.'
          : 'Could not connect to the server. Try again.';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-login"></i> Sign in';
      }
    }

    // Allow pressing Enter in password field to submit
    document.getElementById('login-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('login-username').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('login-password').focus();
    });

    // ── Balance ──────────────────────────────────────────────────
    function renderBalance(value) {
      const el = document.getElementById('balance-display');
      el.classList.remove('loading');
      if (value === null || value === undefined) {
        el.textContent = 'N/A';
      } else {
        const num = parseFloat(value);
        el.textContent = isNaN(num) ? String(value) : '$' + num.toFixed(2);
      }
    }

    // ── Order type ───────────────────────────────────────────────
    function selectType(type) {
      currentType = type;
      ['upvotes', 'comments'].forEach(t => {
        document.getElementById('btn-' + t).classList.toggle('selected', t === type);
        document.getElementById('panel-' + t).classList.toggle('active', t === type);
      });
      document.getElementById('err-type').textContent = '';
      updatePrice();
    }

    function updatePrice() {
      const el = document.getElementById('price-display');
      if (currentType === 'upvotes') {
        const amt = parseInt(document.getElementById('upvote-amount').value) || 0;
        el.textContent = amt > 0 ? '$' + (amt * 0.01).toFixed(2) : '—';
      } else if (currentType === 'comments') {
        const lines = document.getElementById('comment-text').value.split('/').length;
        el.textContent = lines > 0 ? '$' + (lines * 1).toFixed(2) : '—';
      } else {
        el.textContent = '—';
      }
    }

    // ── Validation helpers ───────────────────────────────────────
    function isValidRedditUrl(url) {
      return /^https?:\/\/(www\.)?reddit\.com\/r\/[^\/]+\/comments\/[a-z0-9]+/i.test(url);
    }

    function setErr(id, msg) {
      document.getElementById(id).textContent = msg;
      const input = document.getElementById(id)
        .closest?.('.field-group')
        ?.querySelector('.field-input');
      if (input) input.classList.toggle('error', !!msg);
      return !!msg;
    }

    // ── Submit order ─────────────────────────────────────────────
    async function submitOrder() {
      let invalid = false;

      const name = document.getElementById('client-name').value.trim();
      invalid |= setErr('err-name', name ? '' : 'Please enter a client name.');

      const url = document.getElementById('post-url').value.trim();
      invalid |= setErr('err-url', isValidRedditUrl(url) ? '' : 'Enter a valid Reddit post URL.');

      invalid |= setErr('err-type', currentType ? '' : 'Select an order type.');

      if (currentType === 'upvotes') {
        const amt = parseInt(document.getElementById('upvote-amount').value);
        invalid |= setErr('err-upvote-amount', amt > 0 ? '' : 'Enter a valid number of upvotes.');
      }

      if (currentType === 'comments') {
        const txt = document.getElementById('comment-text').value.trim();
        invalid |= setErr('err-comment-text', txt ? '' : 'Provide comment text or instructions.');
      }

      if (invalid) return;

      const payload = {
        client_name: document.getElementById('client-name').value.trim(),
        post_link:   document.getElementById('post-url').value.trim(),
        type:        currentType,
      };

      if (currentType === 'upvotes') {
        payload.target_upvotes   = parseInt(document.getElementById('upvote-amount').value);
        payload.upvotes_per_hour = parseInt(document.getElementById('upvote-speed').value);
      } else {
        const lines = document.getElementById('comment-text').value.split('/').length;
        payload.target_comments = lines;
        payload.comment_text    = document.getElementById('comment-text').value.trim();
      }

      try {
        const res = await fetch('https://sir-compensation-inexpensive-classes.trycloudflare.com/register/upvote/order', {
          method: 'POST',
          headers: {
            'X-API-KEY': password
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        console.log(`${JSON.stringify(data)}`)
        if (data.status !== 'ok') {
          throw new Error('Register order failed');
          document.getElementById('error-banner').style.display = 'block';
        }
        else {
          document.getElementById('success-banner').style.display = 'block';
        }
        //if (tg) tg.sendData(JSON.stringify(payload));
      } catch (e) {
        console.error('Telegram sendData error:', e);
      }
    }
  </script>
